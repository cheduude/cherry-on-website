<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cherries-fill.svg" />
    <link rel="stylesheet" href="/vendor/unicons/css/unicons.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cherry-on-website</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background-color: #0f0f0f;
      }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root {
        background-color: #f4f5f7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="tg-root" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99999;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
